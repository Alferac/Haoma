llm:
  # Провайдер LLM: "claude" или "openrouter"
  provider: "openrouter"

  # Модель для Claude: claude-sonnet-4-6, claude-opus-4-6, claude-haiku-4-5-20251001
  # Модель для OpenRouter: anthropic/claude-sonnet-4-6, openai/gpt-4o, google/gemini-2.0-flash, etc.
  model: "google/gemini-3-flash-preview"

  # Максимальное количество токенов в ответе
  max_tokens: 4000

  # Температура генерации (0.0 - 1.0)
  temperature: 0.3

  # Промт для анализа субтитров.
  # {title} и {url} будут подставлены автоматически.
  prompt: |
    Ты — аналитик технического контента, специализирующийся на сжатии информации без потери смысла.
    Тебе предоставлены субтитры YouTube-видео "{title}".
    Твоя задача — создать предельно сжатый, иерархически структурированный конспект.
    СТРОГИЕ ПРАВИЛА ОФОРМЛЕНИЯ:
    1. НИКАКИХ вводных фраз («Вот конспект...», «Видео о...»). Сразу начинай с первого заголовка.
    2. НЕ пиши название видео и НЕ вставляй ссылки на источник.
    3. Стиль: технический, телеграфный, сухой. Минимум слов, максимум смысла. Убирай «воду» и вводные конструкции («Автор считает, что...»).
    4. Форматирование: Исключительно Markdown. Используй вложенные списки для иерархии.
    СТРУКТУРА ОТВЕТА:
    ## Суть
    В 1-2 предложениях сформулируй ядро видео. Какую главную техническую или прикладную проблему оно решает.
    ## Ключевые тезисы
    - Список из 5-7 важнейших фактов.
    - Формулируй как утверждения, а не как пересказ действий.
    ## Детальный разбор
    Разбей контент на логические блоки. Используй вложенные списки вместо текста.
    Формат для технических проблем:
    *   **[Название блока/темы]**
        *   *Проблема:* [Краткая суть проблемы]
        *   *Решение:* [Техническое решение/инструмент]
        *   *Деталь:* [Важное уточнение, если есть]
    ## Практика
    *   Конкретные действия (что внедрить, что скачать, какой код использовать).
    *   Советы «бери и делай».

subtitles:
  # Приоритет языков субтитров (первый найденный будет использован)
  languages:
    - "ru"
    - "en"

  # Предпочитать ручные субтитры перед автоматическими
  prefer_manual: true

channel:
  # Максимальное количество видео, обрабатываемых из канала за один запрос.
  # Если на канале 100 видео, а параметр равен 10 — обработаются только 10 последних.
  max_videos: 50

output:
  # Путь к папке для сохранения Markdown-файлов (папка Obsidian)
  # Windows: C:/Users/YourName/Obsidian/YouTube
  # Linux/Mac: /home/yourname/Obsidian/YouTube
  folder: "D:/Obsidian"

  # Добавлять YAML frontmatter с метаданными в начало файла
  add_frontmatter: true

  # Максимальная длина имени файла (без расширения)
  max_filename_length: 100
