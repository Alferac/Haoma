# Прокси для подключения к Telegram API (если сервер в РФ)
# Примеры: socks5://127.0.0.1:10808  или  http://127.0.0.1:1080
telegram_proxy: "socks5://127.0.0.1:10808"

llm:
  # Провайдер LLM: "claude" или "openrouter"
  provider: "openrouter"

  # Модель для Claude: claude-sonnet-4-6, claude-opus-4-6, claude-haiku-4-5-20251001
  # Модель для OpenRouter: anthropic/claude-sonnet-4-6, openai/gpt-4o, google/gemini-2.0-flash, etc.
  model: "openai/gpt-oss-120b:exacto"

  # Максимальное количество токенов в ответе
  max_tokens: 6000

  # Температура генерации (0.0 - 1.0)
  temperature: 0.0

  # Промт для анализа субтитров хранится отдельно в файле. Указывать путь относительно config.yaml
  prompt_file: "analysis_prompt.md"

subtitles:
  # Приоритет языков субтитров (первый найденный будет использован)
  languages:
    - "ru"
    - "en"

  # Предпочитать ручные субтитры перед автоматическими
  prefer_manual: true

channel:
  # Максимальное количество видео, обрабатываемых из канала за один запрос.
  # Если на канале 100 видео, а параметр равен 10 — обработаются только 10 последних.
  max_videos: 50
  # Задержка между скачиванием субтитров при пакетной обработке (секунды).
  # Снижает риск блокировки со стороны YouTube.
  batch_delay_seconds: 60

proxy:
  # HTTP/SOCKS прокси для обхода блокировки YouTube на VPS.
  # Оставь пустым если прокси не нужен.
  # Примеры:
  #   http:  "http://user:pass@host:port"
  #   socks: "socks5://user:pass@host:port"
  http: ""
  https: ""

output:
  # Путь к папке для сохранения Markdown-файлов (папка Obsidian)
  # Windows: C:/Users/YourName/Obsidian/YouTube
  # Linux/Mac: /home/yourname/Obsidian/YouTube
  folder: "/home/deploy/obsidian-notes/source"

  # Добавлять YAML frontmatter с метаданными в начало файла
  add_frontmatter: true

  # Максимальная длина имени файла (без расширения)
  max_filename_length: 100

reconciler:
  # Включить автоматическое обновление индекса сущностей Obsidian
  enabled: true

  # Корень vault Obsidian (для создания файлов Tools/, Architecture/ и т.д.)
  vault_path: "/home/deploy/obsidian-notes"

  # Путь к файлу индекса сущностей
  index_path: "/home/deploy/obsidian-notes/_system/entity_index.json"
