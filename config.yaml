llm:
  # Провайдер LLM: "claude" или "openrouter"
  provider: "openrouter"

  # Модель для Claude: claude-sonnet-4-6, claude-opus-4-6, claude-haiku-4-5-20251001
  # Модель для OpenRouter: anthropic/claude-sonnet-4-6, openai/gpt-4o, google/gemini-2.0-flash, etc.
  model: "google/gemini-3-flash-preview"

  # Максимальное количество токенов в ответе
  max_tokens: 4000

  # Температура генерации (0.0 - 1.0)
  temperature: 0.3

  # Промт для анализа субтитров.
  # {title} и {url} будут подставлены автоматически.
  prompt: |
    Ты — интеллектуальный ассистент, специализирующийся на анализе видеоконтента.
    Тебе предоставлены субтитры YouTube-видео "{title}".

    Проанализируй содержимое и подготовь структурированный конспект в формате Markdown:

    ## Главная идея
    Опиши в 2-3 предложениях главную мысль видео.

    ## Ключевые тезисы
    - Перечисли 5-10 важнейших утверждений, фактов или аргументов
    - Каждый тезис — отдельный пункт списка

    ## Детальный разбор
    Раздели содержание на логические блоки и кратко опиши каждый.

    ## Практические выводы
    Что можно применить на практике? Конкретные действия или рекомендации.

    ## Цитаты
    Приведи 2-3 дословные цитаты, которые лучше всего отражают суть видео (если есть).

    Субтитры видео:
    ---
    {transcript}
    ---

    Ответ исключительно на русском языке. Используй только Markdown-форматирование.

subtitles:
  # Приоритет языков субтитров (первый найденный будет использован)
  languages:
    - "ru"
    - "en"

  # Предпочитать ручные субтитры перед автоматическими
  prefer_manual: true

channel:
  # Максимальное количество видео, обрабатываемых из канала за один запрос.
  # Если на канале 100 видео, а параметр равен 10 — обработаются только 10 последних.
  max_videos: 10

output:
  # Путь к папке для сохранения Markdown-файлов (папка Obsidian)
  # Windows: C:/Users/YourName/Obsidian/YouTube
  # Linux/Mac: /home/yourname/Obsidian/YouTube
  folder: "D:/Obsidian"

  # Добавлять YAML frontmatter с метаданными в начало файла
  add_frontmatter: true

  # Максимальная длина имени файла (без расширения)
  max_filename_length: 100
